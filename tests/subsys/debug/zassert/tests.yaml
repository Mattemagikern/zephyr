common:
  tags:
    - assert
  integration_platforms:
    - native_sim
  platform_allow:
    - native_sim

tests:
  # Both groups explicitly disabled.
  os.zassert.all_off:
    extra_configs:
      - CONFIG_ASSERT_MODULE_MYMODULE_LEVEL_OFF=y
      - CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_OFF=y
  # Both groups at Terse (banner only).
  os.zassert.both_terse:
    extra_configs:
      - CONFIG_ASSERT_MODULE_MYMODULE_LEVEL_TERSE=y
      - CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_TERSE=y
  # MYMODULE forced to Terse; DEFAULT stays at the system-wide Verbose default.
  os.zassert.mymodule_terse:
    extra_configs:
      - CONFIG_ASSERT_MODULE_MYMODULE_LEVEL_TERSE=y
  # DEFAULT forced to Terse; MYMODULE stays at the system-wide Verbose default.
  os.zassert.default_terse:
    extra_configs:
      - CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_TERSE=y
  # MYMODULE raised to Verbose; DEFAULT stays at the system-wide Verbose default.
  os.zassert.mymodule_verbose:
    extra_configs:
      - CONFIG_ASSERT_MODULE_MYMODULE_LEVEL_VERBOSE=y
  # DEFAULT raised to Verbose; MYMODULE stays at the system-wide Verbose default.
  os.zassert.default_verbose:
    extra_configs:
      - CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_VERBOSE=y
  # System-wide default Terse: both groups inherit Terse.
  os.zassert.global_terse:
    extra_configs:
      - CONFIG_ASSERT_DEFAULT_LEVEL_TERSE=y
  # System-wide default Terse; MYMODULE overridden to Verbose.
  os.zassert.global_terse_mymodule_verbose:
    extra_configs:
      - CONFIG_ASSERT_DEFAULT_LEVEL_TERSE=y
      - CONFIG_ASSERT_MODULE_MYMODULE_LEVEL_VERBOSE=y
  # Legacy option derives the system-wide default; both groups inherit Terse.
  os.zassert.legacy_no_msg_info:
    extra_configs:
      - CONFIG_ASSERT_NO_MSG_INFO=y
  # Both groups Normal (checked, no message).
  os.zassert.both_normal:
    extra_configs:
      - CONFIG_ASSERT_MODULE_MYMODULE_LEVEL_NORMAL=y
      - CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_NORMAL=y
  # Different level per group.
  os.zassert.mixed:
    extra_configs:
      - CONFIG_ASSERT_MODULE_MYMODULE_LEVEL_NORMAL=y
      - CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_VERBOSE=y
  # Master switch off: every group forced OFF regardless of its config.
  os.zassert.disabled:
    extra_configs:
      - CONFIG_ASSERT=n
  os.zassert.legacy_level_off:
    extra_configs:
      - CONFIG_ASSERT_LEVEL=0
  os.zassert.no_printk:
    build_only: true
    extra_configs:
      - CONFIG_ASSERT=y
      - CONFIG_PRINTK=n
      - CONFIG_BOOT_BANNER=n
      - CONFIG_TEST_LOGGING_DEFAULTS=n
      - CONFIG_LOG=n
